<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Rent Car</title>
    <meta name="description" content="Create your Rent Car account and start exploring premium car rental options.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Back Link -->
    <a href="index.html" class="back-link">
        <i class="bi bi-arrow-left"></i> Back to Home
    </a>

    <div class="register-page">
        <div class="register-container">
            <div class="register-left">
                <h1>⚡ Rent Car</h1>
                <p>Create your account and start your journey with premium car rentals.</p>
                <a href="index.html" class="login-link">← Back to Home</a>
            </div>
            <div class="register-right">
                <h2>SIGN UP</h2>
                <div class="profile-pic">
                    <img src="./images.jpeg" alt="Profile Picture">
                    <input type="file" id="profile-upload" hidden>
                    <label for="profile-upload" class="upload-icon">+</label>
                </div>
                <form id="registerForm">
                    <div class="name-fields">
                        <input type="text" id="first-name" placeholder="First Name" required>
                        <input type="text" id="last-name" placeholder="Last Name" required>
                    </div>
                    <input type="email" id="email" placeholder="Email Address" required>
                    <div class="password-fields">
                        <input type="password" id="password" placeholder="Password" required>
                        <input type="password" id="repeat-password" placeholder="Confirm Password" required>
                    </div>
                    <button type="submit" class="submit-btn">»</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
        crossorigin="anonymous"></script>
    <script src="animations.js"></script>
</body>

</html>
